<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ficha de Personaje</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- CONTENEDOR PERSPECTIVA 3D -->
  <div class="sheet-wrapper">
    <div class="sheet-card" id="sheetCard">

      <!-- SOLAPA INCRUSTADA EN LA ESQUINA SUPERIOR IZQUIERDA -->
      <div class="npc-tab-header"></div>

      <!-- ================= CARA FRONTAL ================= -->
      <div class="sheet-face front">
        <div class="header-actions">
          <button type="button" class="btn-action" onclick="toggleSheetFace()">
            <span class="tab-icon icon-book-light"></span> Ver Habilidades
          </button>

          <div style="display: flex; gap: 6px;">
            <button type="button" class="btn-action" onclick="exportCharacter()" title="Descargar personaje en JSON">
              <span class="tab-icon icon-download-light"></span> Exportar
            </button>
            <button type="button" class="btn-action" onclick="triggerImport()" title="Cargar personaje desde JSON">
              <span class="tab-icon icon-upload-light"></span> Importar
            </button>
          </div>
        </div>

        <h1>Ficha de Personaje</h1>

        <!-- DATOS BÁSICOS -->
        <div class="section">
          <div class="form-group">
            <label>Nombre del Personaje</label>
            <input type="text" placeholder="Ej: Orc el Indomable">
          </div>
          <div class="grid-2">
            <div class="form-group">
              <label>Clase</label>
              <input type="text" placeholder="Ej: Mago">
            </div>
            <div class="form-group">
              <label>Sexo</label>
              <input type="text" placeholder="Ej: Masculino">
            </div>
            <div class="form-group">
              <label>Raza</label>
              <input type="text" placeholder="Ej: Humano">
            </div>
            <div class="form-group">
              <label>Nivel</label>
              <input type="number" value="1">
            </div>
          </div>
        </div>

        <!-- VIDA Y RECURSOS -->
        <div class="section grid-2">
          <div class="form-group">
            <label>Vida (Actual / Máx)</label>
            <input type="text" placeholder="20 / 20">
          </div>
          <div class="form-group">
            <label>Exp</label>
            <input type="number" placeholder="0">
          </div>
          <div class="form-group">
            <label>Oro</label>
            <input type="number" placeholder="0">
          </div>

          <div class="form-group full-width">
            <label>Energías (<span id="energyCount">3</span>/3)</label>
            <div class="circle-tracker" id="energyTracker">
              <input type="checkbox" class="energy-cb">
              <input type="checkbox" class="energy-cb">
              <input type="checkbox" class="energy-cb">
            </div>
          </div>

          <div class="form-group full-width">
            <label>Tiradas de Salvación (<span id="saveCount">3</span>/3)</label>
            <div class="circle-tracker" id="saveTracker">
              <input type="checkbox" class="save-cb">
              <input type="checkbox" class="save-cb">
              <input type="checkbox" class="save-cb">
            </div>
          </div>

          <div class="form-group full-width">
            <label>Comida / Raciones (<span id="foodCount">5</span>/5)</label>
            <div class="circle-tracker" id="foodTracker">
              <input type="checkbox" class="food-cb">
              <input type="checkbox" class="food-cb">
              <input type="checkbox" class="food-cb">
              <input type="checkbox" class="food-cb">
              <input type="checkbox" class="food-cb">
            </div>
          </div>
        </div>

        <!-- ESTADOS -->
        <div class="section">
          <h2>Estados / Efectos</h2>
          <div class="add-item-form">
            <input type="text" id="statusName" placeholder="Ej: Envenenado">
            <input type="text" id="statusDuration" class="input-short" placeholder="Cargas">
            <button type="button" onclick="addStatus()">+</button>
          </div>
          <ul id="statusList" class="item-list"></ul>
        </div>

        <!-- ATRIBUTOS -->
        <div class="section">
          <h2>Atributos</h2>
          <div class="grid-stats">
            <div class="form-group">
              <label>Constitución</label>
              <input type="text" inputmode="decimal" placeholder="10" oninput="this.value = this.value.replace(/[^0-9+\-.,]/g, '')">
            </div>
            <div class="form-group">
              <label>Fuerza</label>
              <input type="text" inputmode="decimal" placeholder="10" oninput="this.value = this.value.replace(/[^0-9+\-.,]/g, '')">
            </div>
            <div class="form-group">
              <label>Destreza</label>
              <input type="text" inputmode="decimal" placeholder="10" oninput="this.value = this.value.replace(/[^0-9+\-.,]/g, '')">
            </div>
            <div class="form-group">
              <label>Inteligencia</label>
              <input type="text" inputmode="decimal" placeholder="10" oninput="this.value = this.value.replace(/[^0-9+\-.,]/g, '')">
            </div>
            <div class="form-group">
              <label>Sabiduría</label>
              <input type="text" inputmode="decimal" placeholder="10" oninput="this.value = this.value.replace(/[^0-9+\-.,]/g, '')">
            </div>
            <div class="form-group">
              <label>Carisma</label>
              <input type="text" inputmode="decimal" placeholder="10" oninput="this.value = this.value.replace(/[^0-9+\-.,]/g, '')">
            </div>
            <div class="form-group">
              <label>Velocidad</label>
              <input type="text" inputmode="decimal" placeholder="30+5" oninput="this.value = this.value.replace(/[^0-9+\-.,]/g, '')">
            </div>
            <div class="form-group">
              <label>Percepción</label>
              <input type="text" inputmode="decimal" placeholder="10" oninput="this.value = this.value.replace(/[^0-9+\-.,]/g, '')">
            </div>
          </div>

          <div class="form-group hit-dice-group">
            <label>Dados / Puntos de Golpe (PG)</label>
            <input type="text" placeholder="Ej: 2d12">
          </div>
          <div class="form-group">
            <label>Puntos de Guardia</label>
            <input type="text" inputmode="decimal" placeholder="14">
          </div>
        </div>

        <!-- PANEL EQUIPAMIENTO -->
        <div class="section">
          <h2>Equipamiento</h2>
          <div class="item-input-container">
            <div class="form-row" style="display: flex; gap: 8px; margin-bottom: 6px;">
              <input type="text" id="equipName" placeholder="Ej: Filo sangriento" style="flex: 2;">
              <input type="number" id="equipQty" value="1" min="1" style="flex: 0.8; text-align: center;">
              <button type="button" class="btn-primary" onclick="addEquipment()" style="padding: 0 16px;">+</button>
            </div>
            
            <label class="checkbox-extra">
              <input type="checkbox" id="equipHasDetails" onchange="toggleExtraFields('equip')">
              <span>Agregar detalles / estadísticas avanzadas</span>
            </label>

            <!-- CAMPOS EXTRA DINÁMICOS -->
            <div id="equipExtraFields" class="extra-fields-container" style="display: none; margin-top: 8px;">
              <div class="form-group" style="margin-bottom: 8px;">
                <label style="font-size: 0.8rem;">Categoría del Objeto</label>
                <select id="equipCategory" onchange="updateItemCategoryFields('equip')" style="width: 100%;">
                  <option value="weapon">Arma</option>
                  <option value="armor">Armadura / Equipo</option>
                  <option value="relic">Reliquia / Artefacto</option>
                  <option value="other">Otro / Consumible</option>
                </select>
              </div>

              <!-- CAMPOS ESPECÍFICOS: ARMA -->
              <div id="equipFieldsWeapon" class="category-fields-group grid-2" style="display: grid; gap: 6px;">
                <input type="text" id="equipDice" placeholder="Dados (ej: 1d10)">
                <input type="text" id="equipDamageType" placeholder="Tipo daño (ej: Cortante)">
                <input type="text" id="equipRange" placeholder="Alcance (ej: 5 pies)" style="grid-column: span 2;">
              </div>

              <!-- CAMPOS ESPECÍFICOS: ARMADURA -->
              <div id="equipFieldsArmor" class="category-fields-group grid-2" style="display: none; gap: 6px;">
                <input type="text" id="equipGuard" placeholder="Guardia/CA (ej: +4)">
                <input type="text" id="equipBonusStats" placeholder="Stats Extra (ej: +3 DEX, +5 vel)">
              </div>

              <!-- CAMPOS GENERALES -->
              <div style="margin-top: 8px; display: flex; gap: 6px;">
                <select id="equipEffectType" style="flex: 1;">
                  <option value="Activa">Habilidad Activa</option>
                  <option value="Pasiva">Habilidad Pasiva</option>
                  <option value="Lore">Notas / Historia</option>
                </select>
                <input type="text" id="equipRarity" placeholder="Rareza (ej: ★★★★★)" style="flex: 1;">
              </div>

              <textarea id="equipDesc" placeholder="Efecto de la habilidad o descripción completa..." rows="2" style="width: 100%; margin-top: 6px; resize: vertical;"></textarea>
            </div>
          </div>

          <div id="equipmentList" class="items-list" style="margin-top: 10px;"></div>
        </div>

        <!-- PANEL MOCHILA -->
        <div class="section">
          <h2>Mochila</h2>
          <div class="item-input-container">
            <div class="form-row" style="display: flex; gap: 8px; margin-bottom: 6px;">
              <input type="text" id="bagName" placeholder="Ej: Poción de Curación" style="flex: 2;">
              <input type="number" id="bagQty" value="1" min="1" style="flex: 0.8; text-align: center;">
              <button type="button" class="btn-primary" onclick="addBagItem()" style="padding: 0 16px;">+</button>
            </div>

            <label class="checkbox-extra">
              <input type="checkbox" id="bagHasDetails" onchange="toggleExtraFields('bag')">
              <span>Agregar detalles / estadísticas avanzadas</span>
            </label>

            <!-- CAMPOS EXTRA DINÁMICOS MOCHILA -->
            <div id="bagExtraFields" class="extra-fields-container" style="display: none; margin-top: 8px;">
              <div class="form-group" style="margin-bottom: 8px;">
                <label style="font-size: 0.8rem;">Categoría del Objeto</label>
                <select id="bagCategory" onchange="updateItemCategoryFields('bag')" style="width: 100%;">
                  <option value="other">Otro / Consumible</option>
                  <option value="weapon">Arma</option>
                  <option value="armor">Armadura / Equipo</option>
                  <option value="relic">Reliquia / Artefacto</option>
                </select>
              </div>

              <!-- CAMPOS ESPECÍFICOS: ARMA -->
              <div id="bagFieldsWeapon" class="category-fields-group grid-2" style="display: none; gap: 6px;">
                <input type="text" id="bagDice" placeholder="Dados (ej: 1d6)">
                <input type="text" id="bagDamageType" placeholder="Tipo daño (ej: Fuego)">
                <input type="text" id="bagRange" placeholder="Alcance (ej: 20 pies)" style="grid-column: span 2;">
              </div>

              <!-- CAMPOS ESPECÍFICOS: ARMADURA -->
              <div id="bagFieldsArmor" class="category-fields-group grid-2" style="display: none; gap: 6px;">
                <input type="text" id="bagGuard" placeholder="Guardia/CA (ej: +2)">
                <input type="text" id="bagBonusStats" placeholder="Stats Extra (ej: +1 CON)">
              </div>

              <!-- CAMPOS GENERALES -->
              <div style="margin-top: 8px; display: flex; gap: 6px;">
                <select id="bagEffectType" style="flex: 1;">
                  <option value="Consumible">Consumible</option>
                  <option value="Activa">Habilidad Activa</option>
                  <option value="Pasiva">Habilidad Pasiva</option>
                  <option value="Lore">Notas / Historia</option>
                </select>
                <input type="text" id="bagRarity" placeholder="Rareza (ej: ★★★☆☆)" style="flex: 1;">
              </div>

              <textarea id="bagDesc" placeholder="Efecto de la habilidad o descripción completa..." rows="2" style="width: 100%; margin-top: 6px; resize: vertical;"></textarea>
            </div>
          </div>

          <div id="bagList" class="items-list" style="margin-top: 10px;"></div>
        </div>

      </div> <!-- FIN DE LA CARA FRONTAL -->


      <!-- ================= CARA POSTERIOR (HABILIDADES) ================= -->
      <div class="sheet-face back">
        <div class="header-actions">
          <button type="button" class="btn-action" onclick="toggleSheetFace()">
            <span class="tab-icon icon-book-light"></span> Ver Ficha Principal
          </button>

          <div style="display: flex; gap: 6px;">
            <button type="button" class="btn-action" onclick="exportCharacter()" title="Descargar personaje en JSON">
              <span class="tab-icon icon-download-light"></span> Exportar
            </button>
            <button type="button" class="btn-action" onclick="triggerImport()" title="Cargar personaje desde JSON">
              <span class="tab-icon icon-upload-light"></span> Importar
            </button>
          </div>
        </div>

        <h2>Habilidades y Hechizos</h2>
        
        <div class="section" style="margin-bottom: 15px;">
          <div class="form-group">
            <label>Nombre de la Habilidad</label>
            <input type="text" id="skillName" placeholder="Ej: Bola de Fuego">
          </div>

          <div class="grid-2">
            <div class="form-group">
              <label>Tipo</label>
              <select id="skillType" class="skill-select">
                <option value="Activa">Activa</option>
                <option value="Pasiva">Pasiva</option>
              </select>
            </div>
            <div class="form-group">
              <label>Reutilización / Cooldown (Opcional)</label>
              <input type="text" id="skillCooldown" placeholder="Ej: 2 turnos, 1/Descanso">
            </div>
          </div>

        <div class="form-group">
            <label>Categorías / Etiquetas</label>
            <div class="skill-tags-grid" id="skillTagsContainer">
              <label class="tag-checkbox-label"><input type="checkbox" value="Combate"> <span class="tag-icon-elem icon-sword"></span> Combate</label>
              <label class="tag-checkbox-label"><input type="checkbox" value="Defensiva"> <span class="tag-icon-elem icon-shield"></span> Defensiva</label>
              <label class="tag-checkbox-label"><input type="checkbox" value="Apoyo"> <span class="tag-icon-elem icon-apoyo-tag"></span> Apoyo</label>
              <label class="tag-checkbox-label"><input type="checkbox" value="Movilidad"> <span class="tag-icon-elem icon-movilidad-tag"></span> Movilidad</label>
              <label class="tag-checkbox-label"><input type="checkbox" value="Utilidad"> <span class="tag-icon-elem icon-utilidad-tag"></span> Utilidad</label>
            </div>
         </div>
          <div class="form-group">
            <label>Funcionamiento / Descripción</label>
            <textarea id="skillDesc" class="skill-textarea" placeholder="Escribe el alcance, daño, costo, etc."></textarea>
          </div>

          <button type="button" id="btnSaveSkill" class="btn-action" onclick="addSkill()" style="margin-top: 6px;">
            + Agregar Habilidad
          </button>
        </div>

        <div class="section">

         <!-- FILTROS DE TIPO -->
            <div class="skill-filters-group" id="skillFilterButtons">
              <button type="button" class="filter-btn active" onclick="filterSkills('type', 'all')" data-filter="all">Todas</button>
              <button type="button" class="filter-btn filter-activa" onclick="filterSkills('type', 'Activa')" data-filter="Activa">Activas</button>
              <button type="button" class="filter-btn filter-pasiva" onclick="filterSkills('type', 'Pasiva')" data-filter="Pasiva">Pasivas</button>
            </div>

      <!-- FILTROS DE ETIQUETAS -->
        <div class="skill-filters-group" style="margin-top: 6px; display: flex; gap: 4px; align-items: center; flex-wrap: wrap;">
        <button type="button" class="filter-tag-btn active" onclick="filterSkills('tag', 'all')" data-tag="all">Todas</button>
        <button type="button" class="filter-tag-btn filter-tag-icon-btn" onclick="filterSkills('tag', 'Combate')" data-tag="Combate" title="Combate">
          <span class="tag-icon-elem icon-sword"></span>
        </button>
        <button type="button" class="filter-tag-btn filter-tag-icon-btn" onclick="filterSkills('tag', 'Defensiva')" data-tag="Defensiva" title="Defensiva">
          <span class="tag-icon-elem icon-shield"></span>
        </button>
        <button type="button" class="filter-tag-btn filter-tag-icon-btn" onclick="filterSkills('tag', 'Apoyo')" data-tag="Apoyo" title="Apoyo">
          <span class="tag-icon-elem icon-apoyo-tag"></span>
        </button>
        <button type="button" class="filter-tag-btn filter-tag-icon-btn" onclick="filterSkills('tag', 'Movilidad')" data-tag="Movilidad" title="Movilidad">
          <span class="tag-icon-elem icon-movilidad-tag"></span>
        </button>
        <button type="button" class="filter-tag-btn filter-tag-icon-btn" onclick="filterSkills('tag', 'Utilidad')" data-tag="Utilidad" title="Utilidad">
          <span class="tag-icon-elem icon-utilidad-tag"></span>
        </button>
      </div>


          <div class="form-group search-box">
            <label><span class="stat-icon icon-search"></span> Buscar Habilidad</label>
            <input type="text" id="skillSearch" placeholder="Escribe para filtrar..." oninput="renderSkills()">
          </div>

          <div id="skillsList"></div>
        </div>
      </div> <!-- FIN DE LA CARA POSTERIOR -->

    </div>
  </div>
<button type="button" id="floatingDiceBtn" class="floating-dice-btn" title="Lanzador de Dados Libre">
    <span class="tab-icon icon-dice" style="filter: brightness(0) invert(1);"></span>
  </button>


  <!-- MODAL DE DADOS -->
  <div id="diceModalOverlay" class="dice-modal-overlay" style="display: none;">
    <div class="dice-modal-card">
      <h3 style="font-family: var(--font-title); color: var(--accent-color); text-align: center; margin-bottom: 12px;">Tirada Libre de Dados</h3>
      
      <div class="form-group" style="margin-bottom: 8px;">
        <label>Cantidad de Dados</label>
        <input type="number" id="diceCountInput" value="1" min="1" max="100">
      </div>

      <div class="form-group" style="margin-bottom: 8px;">
        <label>Tipo de Dado</label>
        <select id="diceTypeSelect" class="skill-select">
          <option value="4">d4 (4 caras)</option>
          <option value="6">d6 (6 caras)</option>
          <option value="8">d8 (8 caras)</option>
          <option value="10">d10 (10 caras)</option>
          <option value="12" selected>d12 (12 caras)</option>
          <option value="20">d20 (20 caras)</option>
          <option value="100">d100 (100 caras)</option>
        </select>
      </div>

      <div class="form-group" style="margin-bottom: 12px;">
        <label>Modificador (Opcional)</label>
        <input type="number" id="diceModifierInput" value="0">
      </div>

      <button type="button" id="executeRollBtn" class="btn-action" style="width: 100%; justify-content: center; margin-bottom: 10px;">
        ¡Tirar Dados!
      </button>

      <!-- RESULTADO -->
      <div id="diceResultContainer" style="display: none; text-align: center; margin-top: 10px; border-top: 1px dashed var(--paper-border); padding-top: 10px;">
        <div id="critBanner" style="display: none; font-family: var(--font-title); color: #b8860b; font-size: 1.1rem; margin-bottom: 4px; text-shadow: 0 0 4px rgba(218,165,32,0.5);">🌟 ¡CRÍTICO MÁXIMO! 🌟</div>
        <div style="font-size: 0.8rem; text-transform: uppercase; font-weight: bold; color: var(--accent-color);">Total obtenido:</div>
        <div id="diceTotalDisplay" style="font-size: 2.2rem; font-weight: bold; color: var(--accent-color); margin: 4px 0;">0</div>
        
        <button type="button" id="toggleDetailsBtn" style="background: transparent; border: none; color: var(--accent-color); font-size: 0.8rem; text-decoration: underline; cursor: pointer; margin-top: 4px;">Ver detalle de dados</button>
        <div id="diceDetailsList" style="display: none; font-size: 0.85rem; margin-top: 6px; max-height: 80px; overflow-y: auto; background: rgba(255,255,255,0.5); padding: 6px; border-radius: 4px; border: 1px solid var(--paper-border);"></div>
      </div>

      <button type="button" id="closeDiceModalBtn" class="btn-action" style="background: #4a0000; width: 100%; justify-content: center; margin-top: 12px;">
        Cerrar
      </button>
    </div>
  </div>

  <!-- INPUT OCULTO COMPARTIDO PARA IMPORTAR -->
  <input type="file" id="importFileInput" accept=".json" style="display: none;" onchange="importCharacter(event)">

  <!-- SCRIPT CON LÓGICA DE MULTIPERSONAJE Y DATOS -->
  <script type="module" src="js/main.js"></script>

  <script type="module" src="js/dice.js"></script>
</body>
</html>
