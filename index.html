<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ficha de Personaje</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- CONTENEDOR PERSPECTIVA 3D -->
  <div class="sheet-wrapper">
    <div class="sheet-card" id="sheetCard">

      <!-- ================= CARA FRONTAL ================= -->
      <div class="sheet-face front">
        <div class="header-actions">
          <button type="button" class="btn-action" onclick="toggleSheetFace()">
            📖 Ver Habilidades
          </button>

          <div style="display: flex; gap: 6px;">
            <button type="button" class="btn-action" onclick="exportCharacter()" title="Descargar personaje en JSON">
              📥 Exportar
            </button>
            <button type="button" class="btn-action" onclick="triggerImport()" title="Cargar personaje desde JSON">
              📤 Importar
            </button>
          </div>
        </div>

        <h1>Ficha de Personaje</h1>

        <!-- DATOS BÁSICOS -->
        <div class="section">
          <div class="form-group">
            <label>Nombre del Personaje</label>
            <input type="text" placeholder="Ej: Orc el Indomable">
          </div>
          <div class="grid-2">
            <div class="form-group">
              <label>Clase</label>
              <input type="text" placeholder="Ej: Mago">
            </div>
            <div class="form-group">
              <label>Sexo</label>
              <input type="text" placeholder="Ej: Masculino">
            </div>
            <div class="form-group">
              <label>Raza</label>
              <input type="text" placeholder="Ej: Humano">
            </div>
            <div class="form-group">
              <label>Nivel</label>
              <input type="number" value="1">
            </div>
          </div>
        </div>

        <!-- VIDA Y RECURSOS -->
        <div class="section grid-2">
          <div class="form-group">
            <label>Vida (Actual / Máx)</label>
            <input type="text" placeholder="20 / 20">
          </div>
          <div class="form-group">
            <label>Exp</label>
            <input type="number" placeholder="0">
          </div>
          <div class="form-group">
            <label>Oro</label>
            <input type="number" placeholder="0">
          </div>

          <div class="form-group full-width">
            <label>Energías (<span id="energyCount">3</span>/3)</label>
            <div class="circle-tracker" id="energyTracker">
              <input type="checkbox" class="energy-cb">
              <input type="checkbox" class="energy-cb">
              <input type="checkbox" class="energy-cb">
            </div>
          </div>

          <div class="form-group full-width">
            <label>Tiradas de Salvación (<span id="saveCount">3</span>/3)</label>
            <div class="circle-tracker" id="saveTracker">
              <input type="checkbox" class="save-cb">
              <input type="checkbox" class="save-cb">
              <input type="checkbox" class="save-cb">
            </div>
          </div>

          <div class="form-group full-width">
            <label>Comida / Raciones (<span id="foodCount">5</span>/5)</label>
            <div class="circle-tracker" id="foodTracker">
              <input type="checkbox" class="food-cb">
              <input type="checkbox" class="food-cb">
              <input type="checkbox" class="food-cb">
              <input type="checkbox" class="food-cb">
              <input type="checkbox" class="food-cb">
            </div>
          </div>
        </div>

        <!-- ESTADOS -->
        <div class="section">
          <h2>Estados / Efectos</h2>
          <div class="add-item-form">
            <input type="text" id="statusName" placeholder="Ej: Envenenado">
            <input type="text" id="statusDuration" class="input-short" placeholder="Cargas">
            <button type="button" onclick="addStatus()">+</button>
          </div>
          <ul id="statusList" class="item-list"></ul>
        </div>

        <!-- ATRIBUTOS -->
        <div class="section">
          <h2>Atributos</h2>
          <div class="grid-stats">
            <div class="form-group">
              <label>Constitución</label>
              <input type="number" placeholder="10">
            </div>
            <div class="form-group">
              <label>Fuerza</label>
              <input type="number" placeholder="10">
            </div>
            <div class="form-group">
              <label>Destreza</label>
              <input type="number" placeholder="10">
            </div>
            <div class="form-group">
              <label>Inteligencia</label>
              <input type="number" placeholder="10">
            </div>
            <div class="form-group">
              <label>Sabiduría</label>
              <input type="number" placeholder="10">
            </div>
            <div class="form-group">
              <label>Carisma</label>
              <input type="number" placeholder="10">
            </div>
            <div class="form-group">
              <label>Velocidad</label>
              <input type="text" placeholder="30+5">
            </div>
            <div class="form-group">
              <label>Percepción</label>
              <input type="number" placeholder="10">
            </div>
          </div>

          <div class="form-group hit-dice-group">
            <label>Dados / Puntos de Golpe (PG)</label>
            <input type="text" placeholder="Ej: 2d12">
          </div>
          <div class="form-group">
            <label>Puntos de Guardia</label>
            <input type="number" placeholder="14">
          </div>
        </div>

      <!-- PANEL EQUIPAMIENTO -->
<div class="panel">
  <h2>Equipamiento</h2>
  <div class="item-input-container">
    <div class="form-row" style="display: flex; gap: 8px; margin-bottom: 6px;">
      <input type="text" id="equipName" placeholder="Arma, Armadura..." style="flex: 2;">
      <input type="number" id="equipQty" value="1" min="1" style="flex: 0.8; text-align: center;">
      <button type="button" class="btn-primary" onclick="addEquipment()" style="padding: 0 16px;">+</button>
    </div>
    
    <!-- Checkbox para datos adicionales -->
    <label class="checkbox-extra">
      <input type="checkbox" id="equipHasDetails" onchange="toggleExtraFields('equip')">
      <span>Agregar efectos / detalles adicionales</span>
    </label>

   <!-- CAMPOS EXTRAS EQUIPAMIENTO -->
<div id="equipExtraFields" class="extra-fields-container" style="display: none; margin-top: 8px;">
  <div style="display: flex; gap: 8px; margin-bottom: 6px;">
    <select id="equipEffectType" class="input-custom" style="flex: 1;">
      <option value="Pasiva">Efecto Pasivo</option>
      <option value="Activa">Efecto Activo</option>
      <option value="Notas">Notas / Lore</option>
    </select>
  </div>
  <textarea id="equipDesc" class="input-custom" placeholder="Descripción de la habilidad o efecto del objeto..." rows="2" style="width: 100%; resize: vertical;"></textarea>
</div>
  </div>

  <div id="equipmentList" class="items-list" style="margin-top: 10px;"></div>
</div>

<!-- PANEL MOCHILA -->
<div class="panel">
  <h2>Mochila</h2>
  <div class="item-input-container">
    <div class="form-row" style="display: flex; gap: 8px; margin-bottom: 6px;">
      <input type="text" id="bagName" placeholder="Objeto..." style="flex: 2;">
      <input type="number" id="bagQty" value="1" min="1" style="flex: 0.8; text-align: center;">
      <button type="button" class="btn-primary" onclick="addBagItem()" style="padding: 0 16px;">+</button>
    </div>

    <!-- Checkbox para datos adicionales -->
    <label class="checkbox-extra">
      <input type="checkbox" id="bagHasDetails" onchange="toggleExtraFields('bag')">
      <span>Agregar efectos / detalles adicionales</span>
    </label>

    <!-- Campos adicionales (ocultos por defecto) -->
  <div id="bagExtraFields" class="extra-fields-container" style="display: none; margin-top: 8px;">
  <div style="display: flex; gap: 8px; margin-bottom: 6px;">
    <select id="bagEffectType" class="input-custom" style="flex: 1;">
      <option value="Pasiva">Efecto Pasivo</option>
      <option value="Activa">Efecto Activo</option>
      <option value="Notas">Notas / Lore</option>
    </select>
  </div>
  <textarea id="bagDesc" class="input-custom" placeholder="Descripción de la habilidad o efecto del objeto..." rows="2" style="width: 100%; resize: vertical;"></textarea>
</div>
  </div>

  <div id="bagList" class="items-list" style="margin-top: 10px;"></div>
</div>

     <!-- ================= CARA POSTERIOR (HABILIDADES) ================= -->
<div class="sheet-face back">
  <div class="header-actions">
    <button type="button" class="btn-action" onclick="toggleSheetFace()">
      📄 Ver Ficha Principal
    </button>

    <div style="display: flex; gap: 6px;">
      <button type="button" class="btn-action" onclick="exportCharacter()" title="Descargar personaje en JSON">
        📥 Exportar
      </button>
      <button type="button" class="btn-action" onclick="triggerImport()" title="Cargar personaje desde JSON">
        📤 Importar
      </button>
    </div>
  </div>

  <h2>Habilidades y Hechizos</h2>
  
  <div class="section" style="margin-bottom: 15px;">
    <div class="form-group">
      <label>Nombre de la Habilidad</label>
      <input type="text" id="skillName" placeholder="Ej: Bola de Fuego">
    </div>

    <!-- NUEVO: TIPO Y REUTILIZACIÓN EN PARALELO -->
    <div class="grid-2">
      <div class="form-group">
        <label>Tipo</label>
        <select id="skillType" class="skill-select">
          <option value="Activa">Activa</option>
          <option value="Pasiva">Pasiva</option>
        </select>
      </div>
      <div class="form-group">
        <label>Reutilización / Cooldown (Opcional)</label>
        <input type="text" id="skillCooldown" placeholder="Ej: 2 turnos, 1/Descanso">
      </div>
    </div>

    <div class="form-group">
      <label>Funcionamiento / Descripción</label>
      <textarea id="skillDesc" class="skill-textarea" placeholder="Escribe el alcance, daño, costo, etc."></textarea>
    </div>

    <button type="button" id="btnSaveSkill" class="btn-action" onclick="addSkill()" style="margin-top: 6px;">
      + Agregar Habilidad
    </button>
  </div>

  <div class="section">
    <div class="form-group search-box">
      <label>🔍 Buscar Habilidad</label>
      <input type="text" id="skillSearch" placeholder="Escribe para filtrar..." oninput="renderSkills()">
    </div>

    <div id="skillsList"></div>
  </div>
</div>

  <!-- INPUT OCULTO COMPARTIDO PARA IMPORTAR -->
  <input type="file" id="importFileInput" accept=".json" style="display: none;" onchange="importCharacter(event)">

  <script>
    let equipment = [];
    let backpack = [];
    let statuses = [];
    let skills = [];

    // --- ANIMACIÓN FLIP 3D ---
    function toggleSheetFace() {
      const card = document.getElementById('sheetCard');
      card.classList.toggle('flipped');
    }

    // --- LOCALSTORAGE ---
    function saveAllData() {
      const inputs = document.querySelectorAll('.sheet-wrapper input[type="text"], .sheet-wrapper input[type="number"]');
      const inputsData = {};
      inputs.forEach((input, index) => {
        const key = input.id ? input.id : 'input_' + index;
        inputsData[key] = input.value;
      });
      localStorage.setItem('dnd_sheet_inputs', JSON.stringify(inputsData));

      const checkboxes = document.querySelectorAll('.sheet-wrapper input[type="checkbox"]');
      const cbData = Array.from(checkboxes).map(cb => cb.checked);
      localStorage.setItem('dnd_sheet_checkboxes', JSON.stringify(cbData));

      localStorage.setItem('dnd_sheet_equipment', JSON.stringify(equipment));
      localStorage.setItem('dnd_sheet_backpack', JSON.stringify(backpack));
      localStorage.setItem('dnd_sheet_statuses', JSON.stringify(statuses));
      localStorage.setItem('dnd_sheet_skills', JSON.stringify(skills));
    }

    function loadAllData() {
      const savedInputs = JSON.parse(localStorage.getItem('dnd_sheet_inputs') || '{}');
      const inputs = document.querySelectorAll('.sheet-wrapper input[type="text"], .sheet-wrapper input[type="number"]');
      inputs.forEach((input, index) => {
        const key = input.id ? input.id : 'input_' + index;
        if (savedInputs[key] !== undefined) {
          if (!['statusName', 'statusDuration', 'equipName', 'equipQty', 'backpackName', 'backpackQty', 'skillName', 'skillSearch'].includes(input.id)) {
            input.value = savedInputs[key];
          }
        }
      });

      const savedCB = JSON.parse(localStorage.getItem('dnd_sheet_checkboxes') || '[]');
      const checkboxes = document.querySelectorAll('.sheet-wrapper input[type="checkbox"]');
      checkboxes.forEach((cb, index) => {
        if (savedCB[index] !== undefined) {
          cb.checked = savedCB[index];
        }
      });

      equipment = JSON.parse(localStorage.getItem('dnd_sheet_equipment') || '[]');
      backpack = JSON.parse(localStorage.getItem('dnd_sheet_backpack') || '[]');
      statuses = JSON.parse(localStorage.getItem('dnd_sheet_statuses') || '[]');
      skills = JSON.parse(localStorage.getItem('dnd_sheet_skills') || '[]');

      renderEquipment();
      renderBackpack();
      renderStatuses();
      renderSkills();
      updateTrackers();
    }

// Variable para saber si estamos editando
let editingSkillId = null;

// --- HABILIDADES, FAVORITOS & BUSCADOR ---
function renderSkills() {
  const list = document.getElementById('skillsList');
  const searchInput = document.getElementById('skillSearch');
  if (!list) return;

  const filter = searchInput ? searchInput.value.toLowerCase().trim() : '';
  list.innerHTML = '';

  // Ordenamos las habilidades: Primero las Favoritas (isFavorite === true), luego por ID/Creación
  const sortedSkills = [...skills].sort((a, b) => {
    if (a.isFavorite === b.isFavorite) return 0;
    return a.isFavorite ? -1 : 1;
  });

  const filteredSkills = sortedSkills.filter(skill => 
    skill.name.toLowerCase().includes(filter) || 
    skill.desc.toLowerCase().includes(filter) ||
    (skill.type && skill.type.toLowerCase().includes(filter))
  );

  if (filteredSkills.length === 0) {
    list.innerHTML = '<p style="font-style: italic; font-size: 0.85rem; text-align: center; color: var(--accent-color);">No hay habilidades que coincidan.</p>';
    return;
  }

  filteredSkills.forEach(skill => {
    const card = document.createElement('div');
    // Agregamos la clase 'favorite-card' si está en favoritos para aplicarle estilos especiales
    card.className = `skill-card ${skill.isFavorite ? 'favorite-card' : ''}`;

    const typeClass = (skill.type || 'Activa').toLowerCase();
    const cooldownHTML = skill.cooldown && skill.cooldown.trim() !== '' 
      ? `<span class="badge-cooldown">⏳ ${skill.cooldown}</span>` 
      : '';

    // Ícono de estrella según si es favorito o no
    const starIcon = skill.isFavorite ? '★' : '☆';
    const starTitle = skill.isFavorite ? 'Quitar de favoritos' : 'Marcar como favorito';

    card.innerHTML = `
      <div class="skill-card-header">
        <div class="skill-badges">
          <button type="button" class="btn-fav ${skill.isFavorite ? 'active' : ''}" onclick="toggleFavoriteSkill(${skill.id})" title="${starTitle}">
            ${starIcon}
          </button>
          <span class="skill-card-title">${skill.name}</span>
          <span class="badge-type ${typeClass}">${skill.type || 'Activa'}</span>
          ${cooldownHTML}
        </div>
        <div style="display: flex; gap: 4px;">
          <button type="button" class="btn-qty" onclick="editSkill(${skill.id})" title="Editar habilidad">✏️</button>
          <button type="button" class="btn-delete" onclick="deleteSkill(${skill.id})" title="Borrar habilidad">✕</button>
        </div>
      </div>
      <div class="skill-card-desc">${skill.desc}</div>
    `;
    list.appendChild(card);
  });
}

function toggleFavoriteSkill(id) {
  const skill = skills.find(s => s.id === id);
  if (skill) {
    skill.isFavorite = !skill.isFavorite;
    renderSkills();
    saveAllData();
  }
}

function addSkill() {
  const nameInput = document.getElementById('skillName');
  const typeSelect = document.getElementById('skillType');
  const cooldownInput = document.getElementById('skillCooldown');
  const descInput = document.getElementById('skillDesc');

  if (!nameInput || nameInput.value.trim() === '') return;

  if (editingSkillId !== null) {
    // Editar existente
    const skill = skills.find(s => s.id === editingSkillId);
    if (skill) {
      skill.name = nameInput.value.trim();
      skill.type = typeSelect ? typeSelect.value : 'Activa';
      skill.cooldown = cooldownInput ? cooldownInput.value.trim() : '';
      skill.desc = descInput ? descInput.value.trim() : '';
    }
    editingSkillId = null;
    
    const addBtn = document.getElementById('btnSaveSkill');
    if (addBtn) addBtn.textContent = '+ Agregar Habilidad';
  } else {
    // Crear nueva (por defecto no es favorita)
    skills.push({
      id: Date.now(),
      name: nameInput.value.trim(),
      type: typeSelect ? typeSelect.value : 'Activa',
      cooldown: cooldownInput ? cooldownInput.value.trim() : '',
      desc: descInput ? descInput.value.trim() : '',
      isFavorite: false
    });
  }

  // Limpiar campos
  nameInput.value = '';
  if (cooldownInput) cooldownInput.value = '';
  if (descInput) descInput.value = '';
  if (typeSelect) typeSelect.value = 'Activa';

  renderSkills();
  saveAllData();
}

    // --- CONTADORES ---
    function updateTrackers() {
      const saveBoxes = document.querySelectorAll('.save-cb');
      const saveChecked = document.querySelectorAll('.save-cb:checked').length;
      const saveCountElem = document.getElementById('saveCount');

      const energyBoxes = document.querySelectorAll('.energy-cb');
      const energyChecked = document.querySelectorAll('.energy-cb:checked').length;
      const energyCountElem = document.getElementById('energyCount');

      if (energyCountElem) energyCountElem.textContent = energyBoxes.length - energyChecked;
      if (saveCountElem) saveCountElem.textContent = saveBoxes.length - saveChecked;

      const foodBoxes = document.querySelectorAll('.food-cb');
      const foodChecked = document.querySelectorAll('.food-cb:checked').length;
      const foodCountElem = document.getElementById('foodCount');
      if (foodCountElem) foodCountElem.textContent = foodBoxes.length - foodChecked;
    }

    // --- ESTADOS ---
    function renderStatuses() {
      const list = document.getElementById('statusList');
      if (!list) return;
      list.innerHTML = '';
      statuses.forEach(status => {
        const li = document.createElement('li');
        li.className = 'item-card status-card';
        
        const rawDuration = status.duration ? status.duration.trim() : '';
        const isNumeric = rawDuration !== '' && !isNaN(parseInt(rawDuration));
        
        let durationHTML = '';
        if (isNumeric) {
          durationHTML = `
            <div class="item-controls">
              <button type="button" class="btn-qty" onclick="changeStatusQty(${status.id}, -1)">-</button>
              <span class="status-badge">⌛ ${rawDuration}</span>
              <button type="button" class="btn-qty" onclick="changeStatusQty(${status.id}, 1)">+</button>
            </div>
          `;
        } else if (rawDuration !== '') {
          durationHTML = `<span class="status-badge">⌛ ${rawDuration}</span>`;
        }

        li.innerHTML = `
          <span><strong>${status.name}</strong></span>
          <div class="item-controls">
            ${durationHTML}
            <button type="button" class="btn-delete" onclick="deleteStatus(${status.id})">✕</button>
          </div>
        `;
        list.appendChild(li);
      });
    }

    function addStatus() {
      const nameInput = document.getElementById('statusName');
      const durationInput = document.getElementById('statusDuration');
      if (!nameInput || nameInput.value.trim() === '') return;

      statuses.push({
        id: Date.now(),
        name: nameInput.value.trim(),
        duration: durationInput ? durationInput.value.trim() : ''
      });

      nameInput.value = '';
      if (durationInput) durationInput.value = '';
      renderStatuses();
      saveAllData();
    }

    function changeStatusQty(id, delta) {
      const status = statuses.find(s => s.id === id);
      if (status) {
        let current = parseInt(status.duration);
        if (!isNaN(current)) {
          current += delta;
          if (current <= 0) {
            deleteStatus(id);
            return;
          }
          status.duration = current.toString();
          renderStatuses();
          saveAllData();
        }
      }
    }

    function deleteStatus(id) {
      statuses = statuses.filter(s => s.id !== id);
      renderStatuses();
      saveAllData();
    }

    // Mostrar / ocultar campos extras según el checkbox
function toggleExtraFields(prefix) {
  const check = document.getElementById(`${prefix}HasDetails`);
  const container = document.getElementById(`${prefix}ExtraFields`);
  if (check && container) {
    container.style.display = check.checked ? 'block' : 'none';
  }
}

// Alternar el desplegable de detalles en la lista
function toggleItemDetails(elementId) {
  const detailsDiv = document.getElementById(elementId);
  if (detailsDiv) {
    detailsDiv.style.display = detailsDiv.style.display === 'none' ? 'block' : 'none';
  }
}

// --- RENDERING DE OBJETOS (MOCHILA Y EQUIPAMIENTO) ---
function renderItemsList(itemsArray, listContainerId, storageKey) {
  const container = document.getElementById(listContainerId);
  if (!container) return;
  container.innerHTML = '';

  itemsArray.forEach((item, index) => {
    const card = document.createElement('div');
    card.className = 'item-card-wrapper';

    const hasDetails = item.desc && item.desc.trim() !== '';
    const detailsId = `item-desc-${storageKey}-${index}`;

    card.innerHTML = `
      <div class="item-row" style="display: flex; align-items: center; justify-content: space-between; padding: 6px 10px; background: rgba(255,255,255,0.6); border: 1px solid var(--paper-border); border-radius: 4px; margin-bottom: 4px;">
        <div style="display: flex; align-items: center; gap: 6px;">
          ${hasDetails ? `<button type="button" class="btn-toggle-info" onclick="toggleItemDetails('${detailsId}')">📜</button>` : ''}
          <span style="font-weight: bold; font-family: var(--font-heading); text-transform: uppercase;">${item.name}</span>
          ${hasDetails && item.effectType ? `<span class="badge-type ${item.effectType.toLowerCase()}">${item.effectType}</span>` : ''}
        </div>

        <div style="display: flex; align-items: center; gap: 4px;">
          <button type="button" class="btn-qty" onclick="changeItemQty('${storageKey}', ${index}, -1)">–</button>
          <span style="font-weight: bold; min-width: 24px; text-align: center;">x${item.qty}</span>
          <button type="button" class="btn-qty" onclick="changeItemQty('${storageKey}', ${index}, 1)">+</button>
          <button type="button" class="btn-delete" onclick="deleteItem('${storageKey}', ${index})">✕</button>
        </div>
      </div>

      ${hasDetails ? `
        <div id="${detailsId}" class="item-extra-info" style="display: none; padding: 6px 10px; margin-top: -3px; margin-bottom: 6px; background: rgba(0,0,0,0.03); border: 1px dashed var(--paper-border); border-radius: 0 0 4px 4px; font-size: 0.85rem;">
          ${item.desc}
        </div>
      ` : ''}
    `;
    container.appendChild(card);
  });
}

// --- FUNCIONES PARA AGREGAR EQUIPAMIENTO Y MOCHILA ---
function addEquipment() {
  const nameInput = document.getElementById('equipName');
  const qtyInput = document.getElementById('equipQty');
  const hasDetails = document.getElementById('equipHasDetails').checked;
  const effectType = document.getElementById('equipEffectType').value;
  const descInput = document.getElementById('equipDesc');

  if (!nameInput || nameInput.value.trim() === '') return;

  equipment.push({
    name: nameInput.value.trim(),
    qty: parseInt(qtyInput.value) || 1,
    effectType: hasDetails ? effectType : null,
    desc: hasDetails ? descInput.value.trim() : ''
  });

  // Limpiar campos
  nameInput.value = '';
  qtyInput.value = '1';
  descInput.value = '';
  document.getElementById('equipHasDetails').checked = false;
  toggleExtraFields('equip');

  renderEquipment();
  saveAllData();
}

function addBagItem() {
  const nameInput = document.getElementById('bagName');
  const qtyInput = document.getElementById('bagQty');
  const hasDetails = document.getElementById('bagHasDetails').checked;
  const effectType = document.getElementById('bagEffectType').value;
  const descInput = document.getElementById('bagDesc');

  if (!nameInput || nameInput.value.trim() === '') return;

  bag.push({
    name: nameInput.value.trim(),
    qty: parseInt(qtyInput.value) || 1,
    effectType: hasDetails ? effectType : null,
    desc: hasDetails ? descInput.value.trim() : ''
  });

  // Limpiar campos
  nameInput.value = '';
  qtyInput.value = '1';
  descInput.value = '';
  document.getElementById('bagHasDetails').checked = false;
  toggleExtraFields('bag');

  renderBag();
  saveAllData();
}
    // --- IMPORTAR & EXPORTAR ---
    function exportCharacter() {
      saveAllData();

      const characterData = {
        inputs: JSON.parse(localStorage.getItem('dnd_sheet_inputs') || '{}'),
        checkboxes: JSON.parse(localStorage.getItem('dnd_sheet_checkboxes') || '[]'),
        equipment: equipment,
        backpack: backpack,
        statuses: statuses,
        skills: skills
      };

      const charName = characterData.inputs['input_0'] || 'Personaje';
      const fileName = `${charName.replace(/[^a-z0-9]/gi, '_').toLowerCase()}_ficha.json`;

      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(characterData, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", fileName);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function triggerImport() {
      document.getElementById('importFileInput').click();
    }

    function importCharacter(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = JSON.parse(e.target.result);

          if (data.inputs) localStorage.setItem('dnd_sheet_inputs', JSON.stringify(data.inputs));
          if (data.checkboxes) localStorage.setItem('dnd_sheet_checkboxes', JSON.stringify(data.checkboxes));
          if (data.equipment) localStorage.setItem('dnd_sheet_equipment', JSON.stringify(data.equipment));
          if (data.backpack) localStorage.setItem('dnd_sheet_backpack', JSON.stringify(data.backpack));
          if (data.statuses) localStorage.setItem('dnd_sheet_statuses', JSON.stringify(data.statuses));
          if (data.skills) localStorage.setItem('dnd_sheet_skills', JSON.stringify(data.skills));

          loadAllData();
          alert('¡Personaje cargado correctamente!');
        } catch (err) {
          alert('Error al leer el archivo JSON.');
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    // --- EVENT LISTENERS ---
    window.addEventListener('DOMContentLoaded', () => {
      loadAllData();

      document.addEventListener('input', (e) => {
        if (['statusName', 'statusDuration', 'equipName', 'equipQty', 'backpackName', 'backpackQty', 'skillName', 'skillDesc', 'skillSearch', 'skillCooldown'].includes(e.target.id)) {
      return;
        }
        saveAllData();
      });

      document.addEventListener('change', (e) => {
        saveAllData();
        if (e.target.classList.contains('save-cb') || e.target.classList.contains('food-cb') || e.target.classList.contains('energy-cb')) {
          updateTrackers();
        }
      });
    });
  </script>
