<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ficha de Personaje</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- CONTENEDOR PERSPECTIVA 3D -->
  <div class="sheet-wrapper">
    <div class="sheet-card" id="sheetCard">

      <!-- SOLAPA INCRUSTADA EN LA ESQUINA SUPERIOR IZQUIERDA -->
      <div class="npc-tab-header">
        <input type="number" id="activeCharSlot" value="1" min="1" max="3" readonly class="npc-tab-num">
        <button type="button" class="npc-tab-btn" onclick="addNewCharacterSlot()" title="Agregar o cambiar personaje">+</button>
      </div>

      <!-- ================= CARA FRONTAL ================= -->
      <div class="sheet-face front">
        <div class="header-actions">
          <button type="button" class="btn-action" onclick="toggleSheetFace()">
            📖 Ver Habilidades
          </button>

          <div style="display: flex; gap: 6px;">
            <button type="button" class="btn-action" onclick="exportCharacter()" title="Descargar personaje en JSON">
              📥 Exportar
            </button>
            <button type="button" class="btn-action" onclick="triggerImport()" title="Cargar personaje desde JSON">
              📤 Importar
            </button>
          </div>
        </div>

        <h1>Ficha de Personaje</h1>

        <!-- DATOS BÁSICOS -->
        <div class="section">
          <div class="form-group">
            <label>Nombre del Personaje</label>
            <input type="text" placeholder="Ej: Orc el Indomable">
          </div>
          <div class="grid-2">
            <div class="form-group">
              <label>Clase</label>
              <input type="text" placeholder="Ej: Mago">
            </div>
            <div class="form-group">
              <label>Sexo</label>
              <input type="text" placeholder="Ej: Masculino">
            </div>
            <div class="form-group">
              <label>Raza</label>
              <input type="text" placeholder="Ej: Humano">
            </div>
            <div class="form-group">
              <label>Nivel</label>
              <input type="number" value="1">
            </div>
          </div>
        </div>

        <!-- VIDA Y RECURSOS -->
        <div class="section grid-2">
          <div class="form-group">
            <label>Vida (Actual / Máx)</label>
            <input type="text" placeholder="20 / 20">
          </div>
          <div class="form-group">
            <label>Exp</label>
            <input type="number" placeholder="0">
          </div>
          <div class="form-group">
            <label>Oro</label>
            <input type="number" placeholder="0">
          </div>

          <div class="form-group full-width">
            <label>Energías (<span id="energyCount">3</span>/3)</label>
            <div class="circle-tracker" id="energyTracker">
              <input type="checkbox" class="energy-cb">
              <input type="checkbox" class="energy-cb">
              <input type="checkbox" class="energy-cb">
            </div>
          </div>

          <div class="form-group full-width">
            <label>Tiradas de Salvación (<span id="saveCount">3</span>/3)</label>
            <div class="circle-tracker" id="saveTracker">
              <input type="checkbox" class="save-cb">
              <input type="checkbox" class="save-cb">
              <input type="checkbox" class="save-cb">
            </div>
          </div>

          <div class="form-group full-width">
            <label>Comida / Raciones (<span id="foodCount">5</span>/5)</label>
            <div class="circle-tracker" id="foodTracker">
              <input type="checkbox" class="food-cb">
              <input type="checkbox" class="food-cb">
              <input type="checkbox" class="food-cb">
              <input type="checkbox" class="food-cb">
              <input type="checkbox" class="food-cb">
            </div>
          </div>
        </div>

        <!-- ESTADOS -->
        <div class="section">
          <h2>Estados / Efectos</h2>
          <div class="add-item-form">
            <input type="text" id="statusName" placeholder="Ej: Envenenado">
            <input type="text" id="statusDuration" class="input-short" placeholder="Cargas">
            <button type="button" onclick="addStatus()">+</button>
          </div>
          <ul id="statusList" class="item-list"></ul>
        </div>

        <!-- ATRIBUTOS -->
        <div class="section">
          <h2>Atributos</h2>
          <div class="grid-stats">
            <div class="form-group">
              <label>Constitución</label>
              <input type="text" inputmode="decimal" placeholder="10" oninput="this.value = this.value.replace(/[^0-9+\-.,]/g, '')">
            </div>
            <div class="form-group">
              <label>Fuerza</label>
              <input type="text" inputmode="decimal" placeholder="10" oninput="this.value = this.value.replace(/[^0-9+\-.,]/g, '')">
            </div>
            <div class="form-group">
              <label>Destreza</label>
              <input type="text" inputmode="decimal" placeholder="10" oninput="this.value = this.value.replace(/[^0-9+\-.,]/g, '')">
            </div>
            <div class="form-group">
              <label>Inteligencia</label>
              <input type="text" inputmode="decimal" placeholder="10" oninput="this.value = this.value.replace(/[^0-9+\-.,]/g, '')  ">
            </div>
            <div class="form-group">
              <label>Sabiduría</label>
              <input type="text" inputmode="decimal" placeholder="10" oninput="this.value = this.value.replace(/[^0-9+\-.,]/g, '')">
            </div>
            <div class="form-group">
              <label>Carisma</label>
              <input type="text" inputmode="decimal" placeholder="10" oninput="this.value = this.value.replace(/[^0-9+\-.,]/g, '')">
            </div>
            <div class="form-group">
              <label>Velocidad</label>
              <input type="text" inputmode="decimal" placeholder="30+5" oninput="this.value = this.value.replace(/[^0-9+\-.,]/g, '')">
            </div>
            <div class="form-group">
              <label>Percepción</label>
              <input type="text" inputmode="decimal" placeholder="10" oninput="this.value = this.value.replace(/[^0-9+\-.,]/g, '')">
            </div>
          </div>

          <div class="form-group hit-dice-group">
            <label>Dados / Puntos de Golpe (PG)</label>
            <input type="text" placeholder="Ej: 2d12">
          </div>
          <div class="form-group">
            <label>Puntos de Guardia</label>
            <input type="text" inputmode="decimal" placeholder="14">
          </div>
        </div>

        <!-- PANEL EQUIPAMIENTO -->
        <div class="panel">
          <h2>Equipamiento</h2>
          <div class="item-input-container">
            <div class="form-row" style="display: flex; gap: 8px; margin-bottom: 6px;">
              <input type="text" id="equipName" placeholder="Ej: Filo sangriento" style="flex: 2;">
              <input type="number" id="equipQty" value="1" min="1" style="flex: 0.8; text-align: center;">
              <button type="button" class="btn-primary" onclick="addEquipment()" style="padding: 0 16px;">+</button>
            </div>
            
            <label class="checkbox-extra">
              <input type="checkbox" id="equipHasDetails" onchange="toggleExtraFields('equip')">
              <span>Agregar detalles / estadísticas avanzadas</span>
            </label>

            <!-- CAMPOS EXTRA DINÁMICOS -->
            <div id="equipExtraFields" class="extra-fields-container" style="display: none; margin-top: 8px;">
              <div class="form-group" style="margin-bottom: 8px;">
                <label style="font-size: 0.8rem;">Categoría del Objeto</label>
                <select id="equipCategory" class="input-custom" onchange="updateItemCategoryFields('equip')" style="width: 100%;">
                  <option value="weapon">⚔️ Arma</option>
                  <option value="armor">🛡️ Armadura / Equipo</option>
                  <option value="relic">🔮 Reliquia / Artefacto</option>
                  <option value="other">📦 Otro / Consumible</option>
                </select>
              </div>

              <!-- CAMPOS ESPECÍFICOS: ARMA -->
              <div id="equipFieldsWeapon" class="category-fields-group grid-2" style="display: grid; gap: 6px;">
                <input type="text" id="equipDice" placeholder="Dados (ej: 1d10)">
                <input type="text" id="equipDamageType" placeholder="Tipo daño (ej: Cortante)">
                <input type="text" id="equipRange" placeholder="Alcance (ej: 5 pies)" style="grid-column: span 2;">
              </div>

              <!-- CAMPOS ESPECÍFICOS: ARMADURA -->
              <div id="equipFieldsArmor" class="category-fields-group grid-2" style="display: none; gap: 6px;">
                <input type="text" id="equipGuard" placeholder="Guardia/CA (ej: +4)">
                <input type="text" id="equipBonusStats" placeholder="Stats Extra (ej: +3 DEX, +5 vel)">
              </div>

              <!-- CAMPOS GENERALES -->
              <div style="margin-top: 8px; display: flex; gap: 6px;">
                <select id="equipEffectType" class="input-custom" style="flex: 1;">
                  <option value="Activa">Habilidad Activa</option>
                  <option value="Pasiva">Habilidad Pasiva</option>
                  <option value="Lore">Notas / Historia</option>
                </select>
                <input type="text" id="equipRarity" placeholder="Rareza (ej: ★★★★★)" style="flex: 1;">
              </div>

              <textarea id="equipDesc" class="input-custom" placeholder="Efecto de la habilidad o descripción completa..." rows="2" style="width: 100%; margin-top: 6px; resize: vertical;"></textarea>
            </div>
          </div>

          <div id="equipmentList" class="items-list" style="margin-top: 10px;"></div>
        </div>

        <!-- PANEL MOCHILA -->
        <div class="panel">
          <h2>Mochila</h2>
          <div class="item-input-container">
            <div class="form-row" style="display: flex; gap: 8px; margin-bottom: 6px;">
              <input type="text" id="bagName" placeholder="Ej: Poción de Curación" style="flex: 2;">
              <input type="number" id="bagQty" value="1" min="1" style="flex: 0.8; text-align: center;">
              <button type="button" class="btn-primary" onclick="addBagItem()" style="padding: 0 16px;">+</button>
            </div>

            <label class="checkbox-extra">
              <input type="checkbox" id="bagHasDetails" onchange="toggleExtraFields('bag')">
              <span>Agregar detalles / estadísticas avanzadas</span>
            </label>

            <!-- CAMPOS EXTRA DINÁMICOS MOCHILA -->
            <div id="bagExtraFields" class="extra-fields-container" style="display: none; margin-top: 8px;">
              <div class="form-group" style="margin-bottom: 8px;">
                <label style="font-size: 0.8rem;">Categoría del Objeto</label>
                <select id="bagCategory" class="input-custom" onchange="updateItemCategoryFields('bag')" style="width: 100%;">
                  <option value="other">📦 Otro / Consumible</option>
                  <option value="weapon">⚔️ Arma</option>
                  <option value="armor">🛡️ Armadura / Equipo</option>
                  <option value="relic">🔮 Reliquia / Artefacto</option>
                </select>
              </div>

              <!-- CAMPOS ESPECÍFICOS: ARMA -->
              <div id="bagFieldsWeapon" class="category-fields-group grid-2" style="display: none; gap: 6px;">
                <input type="text" id="bagDice" placeholder="Dados (ej: 1d6)">
                <input type="text" id="bagDamageType" placeholder="Tipo daño (ej: Fuego)">
                <input type="text" id="bagRange" placeholder="Alcance (ej: 20 pies)" style="grid-column: span 2;">
              </div>

              <!-- CAMPOS ESPECÍFICOS: ARMADURA -->
              <div id="bagFieldsArmor" class="category-fields-group grid-2" style="display: none; gap: 6px;">
                <input type="text" id="bagGuard" placeholder="Guardia/CA (ej: +2)">
                <input type="text" id="bagBonusStats" placeholder="Stats Extra (ej: +1 CON)">
              </div>

              <!-- CAMPOS GENERALES -->
              <div style="margin-top: 8px; display: flex; gap: 6px;">
                <select id="bagEffectType" class="input-custom" style="flex: 1;">
                  <option value="Consumible">Consumible</option>
                  <option value="Activa">Habilidad Activa</option>
                  <option value="Pasiva">Habilidad Pasiva</option>
                  <option value="Lore">Notas / Historia</option>
                </select>
                <input type="text" id="bagRarity" placeholder="Rareza (ej: ★★★☆☆)" style="flex: 1;">
              </div>

              <textarea id="bagDesc" class="input-custom" placeholder="Efecto de la habilidad o descripción completa..." rows="2" style="width: 100%; margin-top: 6px; resize: vertical;"></textarea>
            </div>
          </div>

          <div id="bagList" class="items-list" style="margin-top: 10px;"></div>
        </div>

      </div> <!-- FIN DE LA CARA FRONTAL -->


      <!-- ================= CARA POSTERIOR (HABILIDADES) ================= -->
      <div class="sheet-face back">
        <div class="header-actions">
          <button type="button" class="btn-action" onclick="toggleSheetFace()">
            📄 Ver Ficha Principal
          </button>

          <div style="display: flex; gap: 6px;">
            <button type="button" class="btn-action" onclick="exportCharacter()" title="Descargar personaje en JSON">
              📥 Exportar
            </button>
            <button type="button" class="btn-action" onclick="triggerImport()" title="Cargar personaje desde JSON">
              📤 Importar
            </button>
          </div>
        </div>

        <h2>Habilidades y Hechizos</h2>
        
        <div class="section" style="margin-bottom: 15px;">
          <div class="form-group">
            <label>Nombre de la Habilidad</label>
            <input type="text" id="skillName" placeholder="Ej: Bola de Fuego">
          </div>

          <div class="grid-2">
            <div class="form-group">
              <label>Tipo</label>
              <select id="skillType" class="skill-select">
                <option value="Activa">Activa</option>
                <option value="Pasiva">Pasiva</option>
              </select>
            </div>
            <div class="form-group">
              <label>Reutilización / Cooldown (Opcional)</label>
              <input type="text" id="skillCooldown" placeholder="Ej: 2 turnos, 1/Descanso">
            </div>
          </div>

          <div class="form-group">
            <label>Funcionamiento / Descripción</label>
            <textarea id="skillDesc" class="skill-textarea" placeholder="Escribe el alcance, daño, costo, etc."></textarea>
          </div>

          <button type="button" id="btnSaveSkill" class="btn-action" onclick="addSkill()" style="margin-top: 6px;">
            + Agregar Habilidad
          </button>
        </div>

        <div class="section">
          <div class="form-group search-box">
            <label>🔍 Buscar Habilidad</label>
            <input type="text" id="skillSearch" placeholder="Escribe para filtrar..." oninput="renderSkills()">
          </div>

          <div id="skillsList"></div>
        </div>
      </div> <!-- FIN DE LA CARA POSTERIOR -->

    </div>
  </div>

  <!-- INPUT OCULTO COMPARTIDO PARA IMPORTAR -->
  <input type="file" id="importFileInput" accept=".json" style="display: none;" onchange="importCharacter(event)">

  <script src="script.js"></script>

  <script>
// --- ESTADO GLOBAL ---
let currentSlot = 1;
const MAX_SLOTS = 3;

// Estructura para almacenar los datos independientes de cada personaje (1, 2 y 3)
let charactersData = {
  1: createEmptyCharacter(),
  2: createEmptyCharacter(),
  3: createEmptyCharacter()
};

let editingSkillId = null;

const formInputIds = [
  'statusName', 'statusDuration', 
  'equipName', 'equipQty', 'equipDice', 'equipDamageType', 'equipRange', 'equipGuard', 'equipBonusStats', 'equipRarity', 'equipDesc',
  'bagName', 'bagQty', 'bagDice', 'bagDamageType', 'bagRange', 'bagGuard', 'bagBonusStats', 'bagRarity', 'bagDesc',
  'skillName', 'skillSearch', 'skillCooldown'
];

function createEmptyCharacter() {
  return {
    inputs: {},
    checkboxes: [],
    equipment: [],
    backpack: [],
    statuses: [],
    skills: []
  };
}

// --- GESTIÓN Y NAVEGACIÓN DE PESTAÑAS (SLOTS) ---
function renderTabs() {
  const tabHeader = document.querySelector('.npc-tab-header');
  if (!tabHeader) return;

  tabHeader.innerHTML = `
    <button type="button" class="tab-btn ${currentSlot === 1 ? 'active' : ''}" onclick="switchSlot(1)">P1</button>
    <button type="button" class="tab-btn ${currentSlot === 2 ? 'active' : ''}" onclick="switchSlot(2)">P2</button>
    <button type="button" class="tab-btn ${currentSlot === 3 ? 'active' : ''}" onclick="switchSlot(3)">P3</button>
  `;
}

function switchSlot(newSlot) {
  if (newSlot === currentSlot) return;
  
  // 1. Guardar el personaje actual antes de cambiar
  saveCurrentCharacterData();

  // 2. Cambiar de slot
  currentSlot = newSlot;

  // 3. Cargar los datos del nuevo slot
  loadCurrentCharacterData();
  renderTabs();
}

function addNewCharacterSlot() {
  let nextSlot = (currentSlot % MAX_SLOTS) + 1;
  switchSlot(nextSlot);
}

// --- GUARDAR Y CARGAR DATOS POR SLOT ---
function saveCurrentCharacterData() {
  const container = document.getElementById('sheetCard');
  if (!container) return;

  // Recopilar Inputs de texto/números
  const inputsData = {};
  const inputs = container.querySelectorAll('input[type="text"], input[type="number"], textarea, select');
  inputs.forEach((input, index) => {
    if (!formInputIds.includes(input.id)) {
      const key = input.id ? input.id : 'input_' + index;
      inputsData[key] = input.value;
    }
  });

  // Recopilar Checkboxes
  const checkboxes = container.querySelectorAll('input[type="checkbox"]');
  const cbData = Array.from(checkboxes).map(cb => cb.checked);

  // Asignar al slot actual
  charactersData[currentSlot].inputs = inputsData;
  charactersData[currentSlot].checkboxes = cbData;

  // Guardar en LocalStorage
  localStorage.setItem('dnd_multichar_data', JSON.stringify(charactersData));
  localStorage.setItem('dnd_active_slot', currentSlot);
}

function loadCurrentCharacterData() {
  const container = document.getElementById('sheetCard');
  if (!container) return;

  const char = charactersData[currentSlot] || createEmptyCharacter();

  // Restablecer Inputs
  const inputs = container.querySelectorAll('input[type="text"], input[type="number"], textarea, select');
  inputs.forEach((input, index) => {
    if (!formInputIds.includes(input.id)) {
      const key = input.id ? input.id : 'input_' + index;
      input.value = char.inputs[key] !== undefined ? char.inputs[key] : (input.defaultValue || '');
    }
  });

  // Restablecer Checkboxes
  const checkboxes = container.querySelectorAll('input[type="checkbox"]');
  checkboxes.forEach((cb, index) => {
    cb.checked = char.checkboxes[index] !== undefined ? char.checkboxes[index] : false;
  });

  // Renderizar componentes
  renderEquipment();
  renderBackpack();
  renderStatuses();
  renderSkills();
  updateTrackers();
}

function loadAllSlotsFromStorage() {
  const savedData = localStorage.getItem('dnd_multichar_data');
  if (savedData) {
    try {
      charactersData = JSON.parse(savedData);
    } catch (e) {
      console.error("Error al cargar datos:", e);
    }
  }
  const savedSlot = parseInt(localStorage.getItem('dnd_active_slot'));
  if (savedSlot && savedSlot >= 1 && savedSlot <= MAX_SLOTS) {
    currentSlot = savedSlot;
  }
}

// --- ROTACIÓN Y VOLTEO DE LA FICHA ---
function toggleSheetFace() {
  const card = document.getElementById('sheetCard');
  card.classList.toggle('flipped');
}

// --- RENDERIZADO DE TABLAS / COMPONENTES ---
function renderEquipment() {
  const container = document.getElementById('equipmentList');
  if (!container) return;
  container.innerHTML = '';

  const equipment = charactersData[currentSlot].equipment || [];

  equipment.forEach((item, index) => {
    const card = document.createElement('div');
    card.className = 'item-card-wrapper';
    const detailsId = `equip-details-${index}`;

    let badgesHTML = '';
    if (item.hasDetails) {
      if (item.dice) badgesHTML += `<span class="badge-stat">🎲 ${item.dice}</span>`;
      if (item.damageType) badgesHTML += `<span class="badge-stat">🗡️ ${item.damageType}</span>`;
      if (item.guard) badgesHTML += `<span class="badge-stat">🛡️ Guardia ${item.guard}</span>`;
    }

    const hasExtraInfo = item.hasDetails && (item.rarity || item.bonusStats || item.range || item.desc);

    card.innerHTML = `
      <div class="item-row" style="display: flex; align-items: center; justify-content: space-between; padding: 6px 10px; background: rgba(255,255,255,0.6); border: 1px solid var(--paper-border); border-radius: 4px; margin-bottom: 4px;">
        <div style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap;">
          ${hasExtraInfo ? `<button type="button" class="btn-toggle-info" onclick="toggleItemDetails('${detailsId}')">📜</button>` : ''}
          <span style="font-weight: bold; font-family: var(--font-heading);">${item.name}</span>
          ${badgesHTML}
        </div>

        <div style="display: flex; align-items: center; gap: 4px;">
          <button type="button" class="btn-qty" onclick="moveItem('equip', ${index}, -1)" title="Subir">▲</button>
          <button type="button" class="btn-qty" onclick="moveItem('equip', ${index}, 1)" title="Bajar">▼</button>
          <button type="button" class="btn-qty" onclick="changeItemQty('equip', ${index}, -1)">–</button>
          <span style="font-weight: bold; min-width: 24px; text-align: center;">x${item.qty}</span>
          <button type="button" class="btn-qty" onclick="changeItemQty('equip', ${index}, 1)">+</button>
          <button type="button" class="btn-delete" onclick="deleteItem('equip', ${index})">✕</button>
        </div>
      </div>

      ${hasExtraInfo ? `
        <div id="${detailsId}" class="item-extra-info" style="display: none; padding: 8px 12px; margin-top: -3px; margin-bottom: 6px; background: rgba(0,0,0,0.03); border: 1px dashed var(--paper-border); border-radius: 0 0 4px 4px; font-size: 0.85rem;">
          ${item.rarity ? `<div style="color: #d4af37; font-size: 0.9rem;">${item.rarity}</div>` : ''}
          ${item.bonusStats ? `<div><strong>Stats:</strong> ${item.bonusStats}</div>` : ''}
          ${item.range ? `<div><strong>Alcance:</strong> ${item.range}</div>` : ''}
          ${item.effectType && item.desc ? `<div style="margin-top: 4px;"><strong>[${item.effectType}]:</strong> ${item.desc}</div>` : (item.desc ? `<div style="margin-top: 4px;">${item.desc}</div>` : '')}
        </div>
      ` : ''}
    `;
    container.appendChild(card);
  });
}

function renderBackpack() {
  const container = document.getElementById('bagList');
  if (!container) return;
  container.innerHTML = '';

  const backpack = charactersData[currentSlot].backpack || [];

  backpack.forEach((item, index) => {
    const card = document.createElement('div');
    card.className = 'item-card-wrapper';
    const detailsId = `bag-details-${index}`;

    let badgesHTML = '';
    if (item.hasDetails) {
      if (item.dice) badgesHTML += `<span class="badge-stat">🎲 ${item.dice}</span>`;
      if (item.damageType) badgesHTML += `<span class="badge-stat">🗡️ ${item.damageType}</span>`;
      if (item.guard) badgesHTML += `<span class="badge-stat">🛡️ Guardia ${item.guard}</span>`;
    }

    const hasExtraInfo = item.hasDetails && (item.rarity || item.bonusStats || item.range || item.desc);

    card.innerHTML = `
      <div class="item-row" style="display: flex; align-items: center; justify-content: space-between; padding: 6px 10px; background: rgba(255,255,255,0.6); border: 1px solid var(--paper-border); border-radius: 4px; margin-bottom: 4px;">
        <div style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap;">
          ${hasExtraInfo ? `<button type="button" class="btn-toggle-info" onclick="toggleItemDetails('${detailsId}')">📜</button>` : ''}
          <span style="font-weight: bold; font-family: var(--font-heading); text-transform: uppercase;">${item.name}</span>
          ${badgesHTML}
        </div>

        <div style="display: flex; align-items: center; gap: 4px;">
          <button type="button" class="btn-qty" onclick="moveItem('backpack', ${index}, -1)" title="Subir">▲</button>
          <button type="button" class="btn-qty" onclick="moveItem('backpack', ${index}, 1)" title="Bajar">▼</button>
          <button type="button" class="btn-qty" onclick="changeItemQty('backpack', ${index}, -1)">–</button>
          <span style="font-weight: bold; min-width: 24px; text-align: center;">x${item.qty}</span>
          <button type="button" class="btn-qty" onclick="changeItemQty('backpack', ${index}, 1)">+</button>
          <button type="button" class="btn-delete" onclick="deleteItem('backpack', ${index})">✕</button>
        </div>
      </div>

      ${hasExtraInfo ? `
        <div id="${detailsId}" class="item-extra-info" style="display: none; padding: 8px 12px; margin-top: -3px; margin-bottom: 6px; background: rgba(0,0,0,0.03); border: 1px dashed var(--paper-border); border-radius: 0 0 4px 4px; font-size: 0.85rem;">
          ${item.rarity ? `<div style="color: #d4af37; font-size: 0.9rem;">${item.rarity}</div>` : ''}
          ${item.bonusStats ? `<div><strong>Stats:</strong> ${item.bonusStats}</div>` : ''}
          ${item.range ? `<div><strong>Alcance:</strong> ${item.range}</div>` : ''}
          ${item.effectType && item.desc ? `<div style="margin-top: 4px;"><strong>[${item.effectType}]:</strong> ${item.desc}</div>` : (item.desc ? `<div style="margin-top: 4px;">${item.desc}</div>` : '')}
        </div>
      ` : ''}
    `;
    container.appendChild(card);
  });
}

function renderSkills() {
  const list = document.getElementById('skillsList');
  const searchInput = document.getElementById('skillSearch');
  if (!list) return;

  const skills = charactersData[currentSlot].skills || [];
  const filter = searchInput ? searchInput.value.toLowerCase().trim() : '';
  list.innerHTML = '';

  if (filter === '') {
    skills.sort((a, b) => (a.isFavorite === b.isFavorite ? 0 : a.isFavorite ? -1 : 1));
  }

  const filteredSkills = skills.filter(skill => 
    skill.name.toLowerCase().includes(filter) || 
    skill.desc.toLowerCase().includes(filter) ||
    (skill.type && skill.type.toLowerCase().includes(filter))
  );

  if (filteredSkills.length === 0) {
    list.innerHTML = '<p style="font-style: italic; font-size: 0.85rem; text-align: center; color: var(--accent-color);">No hay habilidades que coincidan.</p>';
    return;
  }

  filteredSkills.forEach((skill) => {
    const realIndex = skills.findIndex(s => s.id === skill.id);
    const card = document.createElement('div');
    card.className = `skill-card ${skill.isFavorite ? 'favorite-card' : ''}`;

    const typeClass = (skill.type || 'Activa').toLowerCase();
    const cooldownHTML = skill.cooldown && skill.cooldown.trim() !== '' 
      ? `<span class="badge-cooldown">⏳ ${skill.cooldown}</span>` 
      : '';

    const starIcon = skill.isFavorite ? '★' : '☆';
    const starTitle = skill.isFavorite ? 'Quitar de favoritos' : 'Marcar como favorito';

    card.innerHTML = `
      <div class="skill-card-header">
        <div class="skill-badges">
          <button type="button" class="btn-fav ${skill.isFavorite ? 'active' : ''}" onclick="toggleFavoriteSkill(${skill.id})" title="${starTitle}">
            ${starIcon}
          </button>
          <span class="skill-card-title">${skill.name}</span>
          <span class="badge-type ${typeClass}">${skill.type || 'Activa'}</span>
          ${cooldownHTML}
        </div>
        <div style="display: flex; gap: 4px; align-items: center;">
          ${filter === '' ? `
            <button type="button" class="btn-qty" onclick="moveSkill(${realIndex}, -1)" title="Subir">▲</button>
            <button type="button" class="btn-qty" onclick="moveSkill(${realIndex}, 1)" title="Bajar">▼</button>
          ` : ''}
          <button type="button" class="btn-qty" onclick="editSkill(${skill.id})" title="Editar habilidad">✏️</button>
          <button type="button" class="btn-delete" onclick="deleteSkill(${skill.id})" title="Borrar habilidad">✕</button>
        </div>
      </div>
      <div class="skill-card-desc">${skill.desc}</div>
    `;
    list.appendChild(card);
  });
}

function renderStatuses() {
  const list = document.getElementById('statusList');
  if (!list) return;
  list.innerHTML = '';
  const statuses = charactersData[currentSlot].statuses || [];

  statuses.forEach(status => {
    const li = document.createElement('li');
    li.className = 'item-card status-card';
    
    const rawDuration = status.duration ? status.duration.trim() : '';
    const isNumeric = rawDuration !== '' && !isNaN(parseInt(rawDuration));
    
    let durationHTML = '';
    if (isNumeric) {
      durationHTML = `
        <div class="item-controls">
          <button type="button" class="btn-qty" onclick="changeStatusQty(${status.id}, -1)">-</button>
          <span class="status-badge">⌛ ${rawDuration}</span>
          <button type="button" class="btn-qty" onclick="changeStatusQty(${status.id}, 1)">+</button>
        </div>
      `;
    } else if (rawDuration !== '') {
      durationHTML = `<span class="status-badge">⌛ ${rawDuration}</span>`;
    }

    li.innerHTML = `
      <span><strong>${status.name}</strong></span>
      <div class="item-controls">
        ${durationHTML}
        <button type="button" class="btn-delete" onclick="deleteStatus(${status.id})">✕</button>
      </div>
    `;
    list.appendChild(li);
  });
}

// --- ACCIONES CRUD ---
function addEquipment() {
  const nameInput = document.getElementById('equipName');
  const qtyInput = document.getElementById('equipQty');
  const hasDetails = document.getElementById('equipHasDetails').checked;

  if (!nameInput || nameInput.value.trim() === '') return;

  const newItem = {
    id: Date.now(),
    name: nameInput.value.trim(),
    qty: parseInt(qtyInput.value) || 1,
    hasDetails: hasDetails
  };

  if (hasDetails) {
    newItem.category = document.getElementById('equipCategory').value;
    newItem.effectType = document.getElementById('equipEffectType').value;
    newItem.rarity = document.getElementById('equipRarity').value.trim();
    newItem.desc = document.getElementById('equipDesc').value.trim();

    if (newItem.category === 'weapon') {
      newItem.dice = document.getElementById('equipDice').value.trim();
      newItem.damageType = document.getElementById('equipDamageType').value.trim();
      newItem.range = document.getElementById('equipRange').value.trim();
    } else if (newItem.category === 'armor') {
      newItem.guard = document.getElementById('equipGuard').value.trim();
      newItem.bonusStats = document.getElementById('equipBonusStats').value.trim();
    }
  }

  charactersData[currentSlot].equipment.push(newItem);

  nameInput.value = '';
  qtyInput.value = '1';
  document.getElementById('equipDice').value = '';
  document.getElementById('equipDamageType').value = '';
  document.getElementById('equipRange').value = '';
  document.getElementById('equipGuard').value = '';
  document.getElementById('equipBonusStats').value = '';
  document.getElementById('equipRarity').value = '';
  document.getElementById('equipDesc').value = '';
  document.getElementById('equipHasDetails').checked = false;
  toggleExtraFields('equip');

  renderEquipment();
  saveCurrentCharacterData();
}

function addSkill() {
  const nameInput = document.getElementById('skillName');
  const typeSelect = document.getElementById('skillType');
  const cooldownInput = document.getElementById('skillCooldown');
  const descInput = document.getElementById('skillDesc');

  if (!nameInput || nameInput.value.trim() === '') return;
  const skills = charactersData[currentSlot].skills;

  if (editingSkillId !== null) {
    const skill = skills.find(s => s.id === editingSkillId);
    if (skill) {
      skill.name = nameInput.value.trim();
      skill.type = typeSelect ? typeSelect.value : 'Activa';
      skill.cooldown = cooldownInput ? cooldownInput.value.trim() : '';
      skill.desc = descInput ? descInput.value.trim() : '';
    }
    editingSkillId = null;
    const addBtn = document.getElementById('btnSaveSkill');
    if (addBtn) addBtn.textContent = '+ Agregar Habilidad';
  } else {
    skills.push({
      id: Date.now(),
      name: nameInput.value.trim(),
      type: typeSelect ? typeSelect.value : 'Activa',
      cooldown: cooldownInput ? cooldownInput.value.trim() : '',
      desc: descInput ? descInput.value.trim() : '',
      isFavorite: false
    });
  }

  nameInput.value = '';
  if (cooldownInput) cooldownInput.value = '';
  if (descInput) descInput.value = '';
  if (typeSelect) typeSelect.value = 'Activa';

  renderSkills();
  saveCurrentCharacterData();
}

function addStatus() {
  const nameInput = document.getElementById('statusName');
  const durationInput = document.getElementById('statusDuration');
  if (!nameInput || nameInput.value.trim() === '') return;

  charactersData[currentSlot].statuses.push({
    id: Date.now(),
    name: nameInput.value.trim(),
    duration: durationInput ? durationInput.value.trim() : ''
  });

  nameInput.value = '';
  if (durationInput) durationInput.value = '';
  renderStatuses();
  saveCurrentCharacterData();
}

function changeItemQty(storageKey, index, delta) {
  const list = storageKey === 'equip' ? charactersData[currentSlot].equipment : charactersData[currentSlot].backpack;
  if (list[index]) {
    list[index].qty += delta;
    if (list[index].qty <= 0) list.splice(index, 1);
    if (storageKey === 'equip') renderEquipment();
    else renderBackpack();
    saveCurrentCharacterData();
  }
}

function deleteItem(storageKey, index) {
  if (storageKey === 'equip') {
    charactersData[currentSlot].equipment.splice(index, 1);
    renderEquipment();
  } else {
    charactersData[currentSlot].backpack.splice(index, 1);
    renderBackpack();
  }
  saveCurrentCharacterData();
}

function deleteSkill(id) {
  charactersData[currentSlot].skills = charactersData[currentSlot].skills.filter(s => s.id !== id);
  renderSkills();
  saveCurrentCharacterData();
}

function deleteStatus(id) {
  charactersData[currentSlot].statuses = charactersData[currentSlot].statuses.filter(s => s.id !== id);
  renderStatuses();
  saveCurrentCharacterData();
}

function toggleFavoriteSkill(id) {
  const skill = charactersData[currentSlot].skills.find(s => s.id === id);
  if (skill) {
    skill.isFavorite = !skill.isFavorite;
    renderSkills();
    saveCurrentCharacterData();
  }
}

function editSkill(id) {
  const skill = charactersData[currentSlot].skills.find(s => s.id === id);
  if (!skill) return;

  document.getElementById('skillName').value = skill.name;
  document.getElementById('skillType').value = skill.type || 'Activa';
  document.getElementById('skillCooldown').value = skill.cooldown || '';
  document.getElementById('skillDesc').value = skill.desc || '';

  editingSkillId = id;
  const addBtn = document.getElementById('btnSaveSkill');
  if (addBtn) addBtn.textContent = '💾 Guardar Cambios';
}

function moveItem(type, index, direction) {
  const list = type === 'equip' ? charactersData[currentSlot].equipment : charactersData[currentSlot].backpack;
  const targetIndex = index + direction;

  if (targetIndex >= 0 && targetIndex < list.length) {
    const temp = list[index];
    list[index] = list[targetIndex];
    list[targetIndex] = temp;

    if (type === 'equip') renderEquipment();
    else renderBackpack();
    saveCurrentCharacterData();
  }
}

function moveSkill(index, direction) {
  const skills = charactersData[currentSlot].skills;
  const targetIndex = index + direction;
  if (targetIndex < 0 || targetIndex >= skills.length) return;

  const currentSkill = skills[index];
  const targetSkill = skills[targetIndex];

  if (currentSkill.isFavorite && !targetSkill.isFavorite) return;
  if (!currentSkill.isFavorite && targetSkill.isFavorite) return;

  skills[index] = targetSkill;
  skills[targetIndex] = currentSkill;

  renderSkills();
  saveCurrentCharacterData();
}

function changeStatusQty(id, delta) {
  const status = charactersData[currentSlot].statuses.find(s => s.id === id);
  if (status) {
    let current = parseInt(status.duration);
    if (!isNaN(current)) {
      current += delta;
      if (current <= 0) {
        deleteStatus(id);
        return;
      }
      status.duration = current.toString();
      renderStatuses();
      saveCurrentCharacterData();
    }
  }
}

// --- AUXILIARES UI ---
function updateItemCategoryFields(prefix) {
  const category = document.getElementById(`${prefix}Category`).value;
  const weaponFields = document.getElementById(`${prefix}FieldsWeapon`);
  const armorFields = document.getElementById(`${prefix}FieldsArmor`);

  if (weaponFields) weaponFields.style.display = (category === 'weapon') ? 'grid' : 'none';
  if (armorFields) armorFields.style.display = (category === 'armor') ? 'grid' : 'none';
}

function toggleExtraFields(prefix) {
  const check = document.getElementById(`${prefix}HasDetails`);
  const container = document.getElementById(`${prefix}ExtraFields`);
  if (check && container) {
    container.style.display = check.checked ? 'block' : 'none';
    if (check.checked) updateItemCategoryFields(prefix);
  }
}

function toggleItemDetails(elementId) {
  const detailsDiv = document.getElementById(elementId);
  if (detailsDiv) {
    detailsDiv.style.display = detailsDiv.style.display === 'none' ? 'block' : 'none';
  }
}

function updateTrackers() {
  const saveBoxes = document.querySelectorAll('.save-cb');
  const saveChecked = document.querySelectorAll('.save-cb:checked').length;
  const saveCountElem = document.getElementById('saveCount');

  const energyBoxes = document.querySelectorAll('.energy-cb');
  const energyChecked = document.querySelectorAll('.energy-cb:checked').length;
  const energyCountElem = document.getElementById('energyCount');

  if (energyCountElem) energyCountElem.textContent = energyBoxes.length - energyChecked;
  if (saveCountElem) saveCountElem.textContent = saveBoxes.length - saveChecked;

  const foodBoxes = document.querySelectorAll('.food-cb');
  const foodChecked = document.querySelectorAll('.food-cb:checked').length;
  const foodCountElem = document.getElementById('foodCount');
  if (foodCountElem) foodCountElem.textContent = foodBoxes.length - foodChecked;
}

// --- MIGRACIÓN DE DATOS VIEJOS ---
function migrateOldDataIfNeeded() {
  const oldInputs = localStorage.getItem('dnd_sheet_inputs');
  const oldEquipment = localStorage.getItem('dnd_sheet_equipment');
  const oldBackpack = localStorage.getItem('dnd_sheet_backpack');
  const oldStatuses = localStorage.getItem('dnd_sheet_statuses');
  const oldSkills = localStorage.getItem('dnd_sheet_skills');

  // Si existen datos del formato viejo y el nuevo estado está vacío
  if (oldInputs || oldEquipment || oldBackpack || oldStatuses || oldSkills) {
    if (!localStorage.getItem('dnd_multichar_data')) {
      charactersData[1] = {
        inputs: oldInputs ? JSON.parse(oldInputs) : {},
        checkboxes: [],
        equipment: oldEquipment ? JSON.parse(oldEquipment) : [],
        backpack: oldBackpack ? JSON.parse(oldBackpack) : [],
        statuses: oldStatuses ? JSON.parse(oldStatuses) : [],
        skills: oldSkills ? JSON.parse(oldSkills) : []
      };

      // Guardar en el nuevo formato
      localStorage.setItem('dnd_multichar_data', JSON.stringify(charactersData));
      
      // Limpiar claves viejas para evitar remigraciones
      localStorage.removeItem('dnd_sheet_inputs');
      localStorage.removeItem('dnd_sheet_equipment');
      localStorage.removeItem('dnd_sheet_backpack');
      localStorage.removeItem('dnd_sheet_statuses');
      localStorage.removeItem('dnd_sheet_skills');
    }
  }
}

// --- IMPORTAR & EXPORTAR ---
function exportCharacter() {
  saveCurrentCharacterData();
  const characterData = charactersData[currentSlot];
  const charName = characterData.inputs['input_0'] || `Personaje_${currentSlot}`;
  const fileName = `${charName.replace(/[^a-z0-9]/gi, '_').toLowerCase()}_ficha.json`;

  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(characterData, null, 2));
  const downloadAnchor = document.createElement('a');
  downloadAnchor.setAttribute("href", dataStr);
  downloadAnchor.setAttribute("download", fileName);
  document.body.appendChild(downloadAnchor);
  downloadAnchor.click();
  downloadAnchor.remove();
}

function triggerImport() {
  document.getElementById('importFileInput').click();
}

function importCharacter(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      charactersData[currentSlot] = {
        inputs: data.inputs || {},
        checkboxes: data.checkboxes || [],
        equipment: data.equipment || [],
        backpack: data.backpack || [],
        statuses: data.statuses || [],
        skills: data.skills || []
      };

      loadCurrentCharacterData();
      saveCurrentCharacterData();
      alert(`¡Personaje cargado correctamente en el Slot ${currentSlot}!`);
    } catch (err) {
      alert('Error al leer el archivo JSON.');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// --- INICIALIZACIÓN ---
window.addEventListener('DOMContentLoaded', () => {
  loadAllSlotsFromStorage();
  migrateOldDataIfNeeded();
  renderTabs();
  loadCurrentCharacterData();

  document.addEventListener('input', (e) => {
    if (formInputIds.includes(e.target.id)) return;
    saveCurrentCharacterData();
  });

  document.addEventListener('change', (e) => {
    saveCurrentCharacterData();
    if (e.target.classList.contains('save-cb') || e.target.classList.contains('food-cb') || e.target.classList.contains('energy-cb')) {
      updateTrackers();
    }
  });
});
  </script>
